[project]
name = "thense"
version = "0.1.0"
description = "NSE market data acquisition and ML forecasting research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "tqdm>=4.66.0",
    "PyYAML>=6.0.0",
    "huggingface-hub>=0.27.0",
    "yfinance>=0.2.50",
]

[project.scripts]
thense = "thense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thense"]
